name: avo_tv
description: AVO TV v0.7.1 FINAL con TV en vivo premium, reconexión y recomendaciones corregidas.
publish_to: "none"
version: 0.7.1+24

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: 1.6.0
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_android_video: 1.3.8
  path_provider: 2.1.6
  screen_brightness: 2.1.11
  url_launcher: 6.3.2
  background_downloader: 9.5.5
  video_thumbnail: 0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/avo_tv_logo.png
    - assets/branding/avo_tv_tv_banner.png
